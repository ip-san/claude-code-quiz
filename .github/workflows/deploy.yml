name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        task: [typecheck, lint, test, validate]
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: typecheck
        if: matrix.task == 'typecheck'
        run: bunx tsc --noEmit && bunx type-coverage --strict --at-least 99 --ignore-files '**/*.test.ts' --ignore-files '**/*.test.tsx'
      - name: lint
        if: matrix.task == 'lint'
        run: bunx biome check src/ mcp/ scripts/
      - name: test
        if: matrix.task == 'test'
        run: bun run test
      - name: validate
        if: matrix.task == 'validate'
        run: node scripts/quiz-utils.mjs check && node scripts/quiz-utils.mjs check-ellipsis && node scripts/quiz-utils.mjs check-diagram-text && node scripts/validate-docs.mjs && node scripts/validate-docs-links.mjs

  # E2E against a fresh build of this commit. Visual Regression snapshots are
  # macOS-only (*-darwin.png), so CI runs the functional and a11y projects and
  # visual stays in the local `bun run test:e2e`.
  # The Playwright image ships the OS deps and browsers, so no apt step: on the
  # bare runner `playwright install --with-deps` once took 7 min on a slow mirror.
  # Keep the tag equal to @playwright/test in bun.lock.
  e2e:
    needs: check
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
    steps:
      - uses: actions/checkout@v6
      # setup-bun needs unzip, which the image may lack; npm is bundled
      - run: npm install -g bun
      - run: bun install --frozen-lockfile
      # No-op while the image tag matches; downloads only the browser if they drift
      - run: bunx playwright install chromium
      # No VITE_GTM_ID: E2E must never send events to production GA4
      - run: bun run build:web
      - run: bunx playwright test --project=chromium --project=a11y
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7

  build:
    needs: [check, e2e]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun run build:web
        env:
          VITE_GTM_ID: ${{ secrets.VITE_GTM_ID }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist-web
      # On failure, annotate the commit so it's visible in GitHub UI
      - name: Annotate failure
        if: failure()
        run: echo "::error::build:web failed. Check logs above."

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
